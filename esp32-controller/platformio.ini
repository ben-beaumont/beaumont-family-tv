; Family Hub - ESP32 controller for the LG TVs
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
; Your ESP32 shows up as COM3. PlatformIO usually finds it on its own;
; uncomment these if it picks the wrong port.
;upload_port = COM3
;monitor_port = COM3

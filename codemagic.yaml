workflows:
  # Installs directly on registered devices (ad hoc). The phone's UDID must be
  # registered in the Apple Developer portal before the build runs.
  family-tv-ios:
    name: Family TV iPhone app (ad hoc)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      # Name must match the App Store Connect API key you add in Codemagic
      # (Team settings > Integrations > Developer Portal).
      app_store_connect: Codemagic
    environment:
      # Create a variable group called "family_tv" (mark all as Secure) with:
      #   SUPABASE_URL, SUPABASE_ANON_KEY, HOME_LAT, HOME_LNG, DEVELOPMENT_TEAM,
      #   CERTIFICATE_PRIVATE_KEY (contents of the RSA private key file)
      groups:
        - family_tv
      xcode: latest
    triggering:
      events: []   # manual starts only
    scripts:
      - name: Write Secrets.xcconfig
        script: |
          # xcconfig treats // as a comment, so turn https:// into https:/$()/
          URL_ESC=$(echo "$SUPABASE_URL" | sed 's#//#/$()/#')
          {
            echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM"
            echo "SUPABASE_URL = $URL_ESC"
            echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY"
            echo "HOME_LAT = $HOME_LAT"
            echo "HOME_LNG = $HOME_LNG"
            echo "CURRENT_PROJECT_VERSION = $BUILD_NUMBER"
            echo "MARKETING_VERSION = 1.0"
          } > ios/Secrets.xcconfig
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "com.beaumont.familytv" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/BeaumontFamily.xcodeproj
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/BeaumontFamily.xcodeproj \
            --scheme BeaumontFamily
    artifacts:
      - build/ios/ipa/*.ipa

  # Uploads to TestFlight (App Store signing). A build can only be signed one
  # way, so this is a separate build from the ad hoc one above; run both.
  family-tv-ios-testflight:
    name: Family TV iPhone app (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - family_tv
      xcode: latest
    triggering:
      events: []   # manual starts only
    scripts:
      - name: Write Secrets.xcconfig
        script: |
          URL_ESC=$(echo "$SUPABASE_URL" | sed 's#//#/$()/#')
          {
            echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM"
            echo "SUPABASE_URL = $URL_ESC"
            echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY"
            echo "HOME_LAT = $HOME_LAT"
            echo "HOME_LNG = $HOME_LNG"
            echo "CURRENT_PROJECT_VERSION = $BUILD_NUMBER"
            echo "MARKETING_VERSION = 1.0"
          } > ios/Secrets.xcconfig
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "com.beaumont.familytv" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/BeaumontFamily.xcodeproj
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/BeaumontFamily.xcodeproj \
            --scheme BeaumontFamily
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
